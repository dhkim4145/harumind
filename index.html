<script>
const CONTENT = {
  피곤함: {
    emoji: "😮‍💨",
    transition: ["피곤했던 오늘", "그대로 둡니다"],
    completeEmotion: "피곤했던 오늘 그대로"
  },
  불안함: {
    emoji: "🌀",
    transition: ["불안했던 오늘", "여기서 멈춥니다"],
    completeEmotion: "불안했던 오늘 그대로"
  },
  공허함: {
    emoji: "🌑",
    transition: ["비어있던 오늘", "그대로 둡니다"],
    completeEmotion: "비어있던 오늘 그대로"
  },
  쓸쓸함: {
    emoji: "🍂",
    transition: ["쓸쓸했던 오늘", "그대로 둡니다"],
    completeEmotion: "쓸쓸했던 오늘 그대로"
  },
  복잡함: {
    emoji: "🌊",
    transition: ["복잡했던 오늘", "정리하지 않아도 됩니다"],
    completeEmotion: "복잡했던 오늘 그대로"
  },
  괜찮음: {
    emoji: "🌙",
    transition: ["괜찮았던 오늘", "그대로입니다"],
    completeEmotion: "괜찮았던 오늘 그대로"
  }
};

const FLOW_STEP1 = {
  피곤함: "힘을 풉니다",
  불안함: "숨을 내쉽니다",
  공허함: "비워둡니다",
  쓸쓸함: "여기 있습니다",
  복잡함: "내려놓습니다",
  괜찮음: "그대로입니다"
};

const FLOW_COMMON = {
  2: "그대로 둡니다",
  3: "괜찮습니다",
  4: "오늘은 여기까지입니다"
};

const FLOW_DURATION = {
  1: 3500,
  2: 3500,
  3: 4000,
  '3-pause': 4000
};
</script>

<style>
  :root {
    --bg: #0c0c10;
    --surface: #13131b;
    --border: rgba(255,255,255,0.055);
    --border-hover: rgba(255,255,255,0.11);
    --text-primary: #eae6de;
    --text-secondary: #8a8690;
    --text-muted: #48454f;
    --accent: #c4a882;
    --accent-dim: rgba(196,168,130,0.13);
    --accent-border: rgba(196,168,130,0.25);
    --radius: 14px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events:none; z-index:0;
  }

  .app {
    position:relative; z-index:1;
    max-width:420px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
  }

  .screen {
    display:none; flex-direction:column;
    min-height:100vh; padding:0 22px 48px;
    animation: fadeUp .55s cubic-bezier(.22,1,.36,1);
  }
  .screen.active { display:flex; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .header { padding: 48px 0 28px; }

  .wordmark {
    font-family:'Noto Serif KR', serif;
    font-size:10px; letter-spacing:.28em;
    color:var(--accent); opacity:.65; margin-bottom:24px;
  }

  .h-title {
    font-family:'Noto Serif KR', serif;
    font-size:21px; font-weight:300;
    line-height:1.65; letter-spacing:-.01em;
    color:var(--text-primary);
  }

  .emotion-grid {
    display:grid; grid-template-columns:1fr 1fr;
    gap:9px; margin-top:4px;
  }

  .e-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px 15px; cursor:pointer;
    transition: border-color .18s, transform .18s, background .18s;
    display:flex; flex-direction:column; gap:7px; user-select:none;
  }
  .e-card:hover { border-color:var(--border-hover); transform:translateY(-2px); }
  .e-card.selected { border-color:var(--accent); background:var(--accent-dim); }

  .e-emoji { font-size:21px; line-height:1; }
  .e-word {
    font-family:'Noto Serif KR', serif;
    font-size:14px; font-weight:400;
    color:var(--text-primary); letter-spacing:-.01em;
  }
  .e-desc { font-size:11px; color:var(--text-muted); line-height:1.55; }

  .btn {
    width:100%; border:none; border-radius:12px; padding:15px; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px; font-weight:400; letter-spacing:.05em;
    transition: all .18s ease; margin-top:16px;
  }
  .btn-primary { background:var(--accent); color:#1a1410; }
  .btn-primary:hover:not(:disabled) { background:#d4b892; transform:translateY(-1px); }
  .btn-primary:disabled { opacity:.28; cursor:not-allowed; }

  body { transition: background 1.2s cubic-bezier(.4,0,.2,1); }
  body.emotion-피곤함 { background: radial-gradient(ellipse at top, #1a1f2e 0%, #0d1117 60%); }
  body.emotion-불안함 { background: radial-gradient(ellipse at top, #1a1528 0%, #0e0d1a 60%); }
  body.emotion-공허함 { background: radial-gradient(ellipse at top, #111111 0%, #080808 60%); }
  body.emotion-쓸쓸함 { background: radial-gradient(ellipse at top, #1e1410 0%, #120d0a 60%); }
  body.emotion-복잡함 { background: radial-gradient(ellipse at top, #0f1e22 0%, #090f12 60%); }
  body.emotion-괜찮음 { background: radial-gradient(ellipse at top, #141828 0%, #0a0c14 60%); }

  #s-transition {
    justify-content: center; align-items: center;
    padding: 0 32px; min-height: 100vh;
    text-align: center; flex-direction: column; gap: 16px; position: relative;
  }
  .transition-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px; font-weight: 300; color: var(--text-secondary);
    letter-spacing: .04em; line-height: 1.7;
    opacity: 0; transform: translateY(8px); filter: blur(3px);
    transition: opacity 1s cubic-bezier(.22,1,.36,1),
                transform 1s cubic-bezier(.22,1,.36,1),
                filter 1s cubic-bezier(.22,1,.36,1);
  }
  .transition-text.visible { opacity: 1; transform: translateY(0); filter: blur(0); }
  .transition-line2 { font-size: 15px; color: var(--text-muted); transition-delay: .5s; }

  #s-flow {
    justify-content: center; align-items: center;
    padding: 0 32px; min-height: 100vh; position: relative;
  }
  .flow-dots { display: flex; gap: 7px; margin-bottom: 0; }
  .flow-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted);
    transition: background .4s ease, transform .4s ease;
  }
  .flow-dot.active { background: var(--accent); transform: scale(1.3); }
  .flow-dot.done { background: rgba(196,168,130,0.35); }

  .flow-step-indicator {
    font-size: 10px; color: var(--text-muted);
    letter-spacing: .12em; margin-top: 12px; margin-bottom: 52px; opacity: 0.6;
  }

  .flow-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px; font-weight: 300; color: var(--text-primary);
    letter-spacing: -.01em; line-height: 1.7; text-align: center;
    opacity: 0; transform: translateY(10px); filter: blur(4px);
    transition: opacity .9s cubic-bezier(.22,1,.36,1),
                transform .9s cubic-bezier(.22,1,.36,1),
                filter .9s cubic-bezier(.22,1,.36,1);
    min-height: 66px;
  }
  .flow-text.visible { opacity: 1; transform: translateY(0); filter: blur(0); }
  .flow-text.step-3 {
    font-size: 28px; color: var(--accent); letter-spacing: .05em;
    transition: opacity 1.4s cubic-bezier(.22,1,.36,1),
                transform 1.4s cubic-bezier(.22,1,.36,1),
                filter 1.4s cubic-bezier(.22,1,.36,1);
  }
  .flow-text.step-4 {
    font-size: 18px; color: var(--text-secondary); letter-spacing: .04em;
    transition: opacity 1.4s cubic-bezier(.22,1,.36,1),
                transform 1.4s cubic-bezier(.22,1,.36,1),
                filter 1.4s cubic-bezier(.22,1,.36,1);
  }

  .flow-end-btn {
    display: none; margin-top: 56px; width: 100%;
    border: 1px solid var(--accent-border); border-radius: 12px; padding: 15px;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; font-weight: 400; letter-spacing: .08em;
    color: var(--accent); background: var(--accent-dim);
    opacity: 0; transform: translateY(8px);
    transition: opacity .7s ease, transform .7s ease, background .2s ease;
  }
  .flow-end-btn.visible { opacity: 1; transform: translateY(0); }
  .flow-end-btn:hover { background: rgba(196,168,130,0.22); }

  .flow-exit-btn {
    position: absolute; top: 24px; left: 22px;
    background: transparent; border: none; color: var(--text-muted);
    font-size: 20px; line-height: 1; cursor: pointer;
    padding: 4px 8px; opacity: 0.75; transition: opacity .2s ease; z-index: 10;
  }
  .flow-exit-btn:hover { opacity: 1; }

  #s-complete {
    align-items: center; padding: 96px 32px 64px;
    min-height: 100vh; text-align: center;
  }
  .complete-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px; font-weight: 400;
    color: var(--text-primary); letter-spacing: .04em; margin-bottom: 4px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 1.1s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  /* 수정: 🌙 이모지 */
  .complete-moon {
    display: block; font-size: 20px; margin-bottom: 16px;
    opacity: 0;
    transition: opacity 1.1s cubic-bezier(.22,1,.36,1) .3s;
  }
  .complete-emotion {
    font-family: 'Noto Serif KR', serif;
    font-size: 12px; font-weight: 300; color: var(--text-muted);
    letter-spacing: .06em; margin-bottom: 20px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1s cubic-bezier(.22,1,.36,1) .4s, transform 1s cubic-bezier(.22,1,.36,1) .4s;
  }
  .complete-sub {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px; font-weight: 300; color: var(--text-secondary);
    letter-spacing: .08em; margin-bottom: 0;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1s cubic-bezier(.22,1,.36,1) .8s, transform 1s cubic-bezier(.22,1,.36,1) .8s;
  }
  .complete-close {
    font-family: 'Noto Serif KR', serif;
    font-size: 11px; font-weight: 300; color: var(--text-secondary);
    letter-spacing: .08em; margin-bottom: 56px; margin-top: 32px;
    opacity: 0; transform: translateY(6px);
    transition: opacity 1s cubic-bezier(.22,1,.36,1) 1.4s, transform 1s cubic-bezier(.22,1,.36,1) 1.4s;
  }
  .complete-restart {
    border: none; border-radius: 0; padding: 10px 32px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px; font-weight: 300; letter-spacing: .1em;
    color: var(--text-muted); background: transparent;
    opacity: 0; transform: translateY(10px);
    transition: opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1), color .2s ease;
    margin-top: 16px;
    text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: rgba(72,69,79,0.3);
  }
  .complete-restart:hover { color: var(--text-secondary); }
  .complete-restart.visible { opacity: 0.45; transform: translateY(0); }

  #s-complete.visible .complete-title,
  #s-complete.visible .complete-emotion,
  #s-complete.visible .complete-sub,
  #s-complete.visible .complete-close { opacity: 1; transform: translateY(0); }
  #s-complete.visible .complete-moon { opacity: 1; }

  .complete-extras {
    display: none; flex-direction: column; align-items: center;
    width: 100%; margin-top: 48px; opacity: 0; transition: opacity 1.4s ease;
  }
  .complete-extras.visible { opacity: 1; }
  .complete-quote {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px; font-weight: 300; color: var(--text-muted);
    line-height: 2.2; text-align: center; letter-spacing: .03em;
    padding: 28px 8px 0; width: 100%;
  }

  .echo-emoji {
    position: fixed; bottom: 48px; left: 50%;
    transform: translateX(-50%); font-size: 28px;
    opacity: 0; pointer-events: none; z-index: 2; transition: opacity .8s ease;
  }
  .echo-emoji.visible { opacity: 0.15; }
  .echo-emoji.fadeout { opacity: 0; transition: opacity 1.5s ease; }

  @media(max-width:440px){ .app { max-width:100%; } }
</style>

<div class="echo-emoji" id="echo-emoji"></div>

<div class="app">

  <!-- SCREEN 1: 감정 선택 -->
  <div class="screen active" id="s-emotion">
    <div class="header">
      <div class="wordmark">하루마음</div>
      <div class="h-title">오늘 하루,<br>어떤 감정이 가장 가까웠나요</div>
    </div>
    <div class="emotion-grid" id="emotion-grid"></div>
    <button class="btn btn-primary" id="confirm-btn" onclick="startTransition()" disabled>
      이 감정으로 오늘을 마감합니다
    </button>
  </div>

  <!-- SCREEN 2: TRANSITION -->
  <div class="screen" id="s-transition">
    <button class="flow-exit-btn" onclick="exitFlow()" aria-label="감정 선택으로 돌아가기">×</button>
    <div class="transition-text" id="transition-line1"></div>
    <div class="transition-text transition-line2" id="transition-line2"></div>
  </div>

  <!-- SCREEN 3: FLOW -->
  <div class="screen" id="s-flow">
    <button class="flow-exit-btn" onclick="exitFlow()" aria-label="감정 선택으로 돌아가기">×</button>
    <div class="flow-dots" id="flow-dots">
      <div class="flow-dot" data-step="1"></div>
      <div class="flow-dot" data-step="2"></div>
      <div class="flow-dot" data-step="3"></div>
      <div class="flow-dot" data-step="4"></div>
    </div>
    <div class="flow-step-indicator" id="flow-step-indicator">1 / 4</div>
    <div class="flow-text" id="flow-text"></div>
    <button class="flow-end-btn" id="flow-end-btn" onclick="goComplete()">
      오늘은 여기까지 하겠습니다
    </button>
  </div>

  <!-- SCREEN 4: COMPLETE -->
  <div class="screen" id="s-complete">
    <div class="complete-title">오늘은 여기까지입니다</div>
    <span class="complete-moon">🌙</span>
    <div class="complete-emotion" id="complete-emotion"></div>
    <div class="complete-sub">충분합니다</div>
    <div class="complete-close">내일은 내일의 내가 봅니다</div>
    <div class="complete-extras" id="complete-extras">
      <div class="complete-quote" id="complete-quote"></div>
    </div>
    <button class="complete-restart" id="complete-restart" onclick="restart()">다시 시작</button>
  </div>

</div>

<script>
  let selected = null;

  const EMOTION_DESC = {
    피곤함: '몸도 마음도 지쳤을 때',
    불안함: '마음이 가라앉지 않을 때',
    공허함: '아무것도 느껴지지 않을 때',
    쓸쓸함: '혼자인 느낌이 들 때',
    복잡함: '생각이 정리되지 않을 때',
    괜찮음: '나쁘지 않지만 뭔가 부족할 때'
  };

  function renderGrid() {
    const grid = document.getElementById('emotion-grid');
    Object.entries(CONTENT).forEach(([name, data]) => {
      const card = document.createElement('div');
      card.className = 'e-card';
      card.dataset.key = name;
      card.innerHTML = `
        <div class="e-emoji">${data.emoji}</div>
        <div class="e-word">${name}</div>
        <div class="e-desc">${EMOTION_DESC[name] || ''}</div>
      `;
      card.addEventListener('click', () => selectEmotion(name, card));
      grid.appendChild(card);
    });
  }

  const EMOTION_CLASSES = ['emotion-피곤함','emotion-불안함','emotion-공허함','emotion-쓸쓸함','emotion-복잡함','emotion-괜찮음'];

  function selectEmotion(name, card) {
    document.querySelectorAll('.e-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selected = name;
    document.getElementById('confirm-btn').disabled = false;
    document.body.classList.remove(...EMOTION_CLASSES);
    document.body.classList.add('emotion-' + name);
  }

  let flowTimer = null;
  let tapAllowed = false;
  let currentStep = 0;
  let tapIgnoreTimer = null;

  function startTransition() {
    if (!selected) return;
    showScreen('transition');
    const data = CONTENT[selected];
    const line1 = document.getElementById('transition-line1');
    const line2 = document.getElementById('transition-line2');
    line1.textContent = data.transition[0];
    line2.textContent = data.transition[1];
    line1.classList.remove('visible');
    line2.classList.remove('visible');
    flowTimer = setTimeout(() => {
      line1.classList.add('visible');
      line2.classList.add('visible');
      flowTimer = setTimeout(() => startFlow(), 2800);
    }, 300);
  }

  function startFlow() {
    showScreen('flow');
    runFlowStep(1);
  }

  function runFlowStep(step) {
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    currentStep = step;
    tapAllowed = false;

    const tapDelay = (step === 3) ? 1500 : (step === 4) ? Infinity : 500;
    if (tapDelay !== Infinity) {
      tapIgnoreTimer = setTimeout(() => { tapAllowed = true; }, tapDelay);
    }

    document.querySelectorAll('.flow-dot').forEach(d => {
      const s = parseInt(d.dataset.step);
      d.classList.remove('active', 'done');
      if (s === step) d.classList.add('active');
      else if (s < step) d.classList.add('done');
    });

    document.getElementById('flow-step-indicator').textContent = `${step} / 4`;

    const textEl = document.getElementById('flow-text');
    textEl.classList.remove('visible');
    const blankDelay = (step === 1) ? 0 : 300;

    setTimeout(() => {
      textEl.classList.remove('step-3', 'step-4');
      textEl.textContent = '';
      let text = step === 1 ? (FLOW_STEP1[selected] || '') : (FLOW_COMMON[step] || '');
      if (step === 3) textEl.classList.add('step-3');
      if (step === 4) textEl.classList.add('step-4');
      textEl.textContent = text;
      const fadeDelay = (step === 3) ? 200 : (step === 4) ? 500 : 80;
      setTimeout(() => textEl.classList.add('visible'), fadeDelay);
    }, blankDelay);

    const endBtn = document.getElementById('flow-end-btn');
    if (step === 4) {
      endBtn.style.display = 'block';
      setTimeout(() => endBtn.classList.add('visible'), 1000);
    } else {
      endBtn.classList.remove('visible');
      endBtn.style.display = 'none';
    }

    if (step === 3) {
      flowTimer = setTimeout(() => {
        flowTimer = setTimeout(() => runFlowStep(4), FLOW_DURATION['3-pause']);
      }, FLOW_DURATION[3]);
    } else if (FLOW_DURATION[step]) {
      flowTimer = setTimeout(() => runFlowStep(step + 1), FLOW_DURATION[step]);
    }
  }

  function exitFlow() {
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    tapAllowed = false;
    currentStep = 0;
    document.getElementById('transition-line1').classList.remove('visible');
    document.getElementById('transition-line2').classList.remove('visible');
    if (!selected) document.body.classList.remove(...EMOTION_CLASSES);
    showScreen('emotion');
  }

  function goComplete() {
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    tapAllowed = false;
    showScreen('complete');

    const completeScreen = document.getElementById('s-complete');
    completeScreen.classList.remove('visible');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => completeScreen.classList.add('visible'));
    });

    document.getElementById('complete-emotion').textContent = CONTENT[selected].completeEmotion;

    const quote = (typeof getTodayQuote === 'function') ? getTodayQuote(selected) : '';
    const quoteEl = document.getElementById('complete-quote');
    quoteEl.innerHTML = quote.replace(/\n/g, '<br>');

    const extras = document.getElementById('complete-extras');
    const restartBtn = document.getElementById('complete-restart');
    restartBtn.classList.remove('visible');
    extras.style.display = 'flex';
    setTimeout(() => {
      extras.classList.add('visible');
      setTimeout(() => restartBtn.classList.add('visible'), 1000);
    }, 1800);
  }

  function restart() {
    const lastEmoji = selected ? CONTENT[selected].emoji : null;
    clearTimeout(flowTimer);
    document.getElementById('s-complete').classList.remove('visible');
    document.getElementById('complete-restart').classList.remove('visible');
    const extras = document.getElementById('complete-extras');
    extras.classList.remove('visible');
    extras.style.display = 'none';
    selected = null;
    document.querySelectorAll('.e-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('confirm-btn').disabled = true;
    document.body.classList.remove(...EMOTION_CLASSES);
    document.body.style.background = '';
    showScreen('emotion');
    window.scrollTo(0,0);

    if (lastEmoji) {
      const echoEl = document.getElementById('echo-emoji');
      echoEl.textContent = lastEmoji;
      echoEl.classList.remove('visible', 'fadeout');
      setTimeout(() => {
        echoEl.classList.add('visible');
        setTimeout(() => {
          echoEl.classList.add('fadeout');
          echoEl.classList.remove('visible');
          setTimeout(() => {
            echoEl.textContent = '';
            echoEl.classList.remove('fadeout');
          }, 1500);
        }, 2000);
      }, 500);
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s-' + id).classList.add('active');
    window.scrollTo(0, 0);
  }

  document.getElementById('s-flow').addEventListener('click', (e) => {
    if (e.target.closest('.flow-end-btn') || e.target.closest('.flow-exit-btn')) return;
    if (!tapAllowed || currentStep === 4) return;
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    tapAllowed = false;
    runFlowStep(currentStep + 1);
  });

  renderGrid();
</script>
</body>
</html>
