<script>
  /* ──────────────────────────────────────────
     시계
  ────────────────────────────────────────── */
  function tick() {
    const now = new Date();
    const h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0');
    const period = h < 6 ? '새벽' : h < 12 ? '오전' : h < 18 ? '오후' : '밤';
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    document.getElementById('clock').textContent = `${period} ${h12}:${m}`;
  }
  tick(); setInterval(tick, 30000);

  /* ──────────────────────────────────────────
     감정 카드 렌더
  ────────────────────────────────────────── */
  let selected = null;

  const EMOTION_DESC = {
    피곤함: '몸도 마음도 지쳤을 때',
    불안함: '마음이 가라앉지 않을 때',
    공허함: '아무것도 느껴지지 않을 때',
    쓸쓸함: '혼자인 느낌이 들 때',
    복잡함: '생각이 정리되지 않을 때',
    괜찮음: '나쁘지 않지만 뭔가 부족할 때'
  };

  function renderGrid() {
    const grid = document.getElementById('emotion-grid');
    Object.entries(CONTENT).forEach(([name, data]) => {
      const card = document.createElement('div');
      card.className = 'e-card';
      card.dataset.key = name;
      card.innerHTML = `
        <div class="e-emoji">${data.emoji}</div>
        <div class="e-word">${name}</div>
        <div class="e-desc">${EMOTION_DESC[name] || ''}</div>
      `;
      card.addEventListener('click', () => selectEmotion(name, card));
      grid.appendChild(card);
    });
  }

  const EMOTION_CLASSES = ['emotion-피곤함','emotion-불안함','emotion-공허함','emotion-쓸쓸함','emotion-복잡함','emotion-괜찮음'];

  function selectEmotion(name, card) {
    document.querySelectorAll('.e-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selected = name;
    document.getElementById('confirm-btn').disabled = false;
    document.body.classList.remove(...EMOTION_CLASSES);
    document.body.classList.add('emotion-' + name);
  }

  let flowTimer = null;
  let tapAllowed = false;
  let currentStep = 0;
  let tapIgnoreTimer = null;

  /* ──────────────────────────────────────────
     FLOW 엔진
  ────────────────────────────────────────── */
  function startFlow() {
    if (!selected) return;
    showScreen('flow');
    runFlowStep(1);
  }

  function runFlowStep(step) {
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    currentStep = step;
    tapAllowed = false;

    // 단계별 탭 허용 딜레이
    const tapDelay = (step === 3) ? 1500 : (step === 4) ? Infinity : 500;
    if (tapDelay !== Infinity) {
      tapIgnoreTimer = setTimeout(() => { tapAllowed = true; }, tapDelay);
    }

    // 도트 업데이트
    document.querySelectorAll('.flow-dot').forEach(d => {
      const s = parseInt(d.dataset.step);
      d.classList.remove('active', 'done');
      if (s === step) d.classList.add('active');
      else if (s < step) d.classList.add('done');
    });

    // 단계 표시 업데이트
    document.getElementById('flow-step-indicator').textContent = `${step} / 4`;

    // 텍스트 설정
    const textEl = document.getElementById('flow-text');
    textEl.classList.remove('visible', 'step-3', 'step-4');

    let text = '';
    if (step === 1) {
      text = FLOW_STEP1[selected] || '';
    } else {
      text = FLOW_COMMON[step] || '';
    }

    if (step === 3) textEl.classList.add('step-3');
    if (step === 4) textEl.classList.add('step-4');

    // 종료 버튼 (4단계)
    const endBtn = document.getElementById('flow-end-btn');
    if (step === 4) {
      endBtn.style.display = 'block';
      setTimeout(() => endBtn.classList.add('visible'), 800);
    } else {
      endBtn.classList.remove('visible');
      endBtn.style.display = 'none';
    }

    // 텍스트 페이드인
    textEl.textContent = text;
    setTimeout(() => textEl.classList.add('visible'), 80);

    // 자동 전환 (1~3단계)
    if (step === 3) {
      // 3단계: 텍스트 표시 후 → 2.5초 정지 → 4단계
      flowTimer = setTimeout(() => {
        flowTimer = setTimeout(() => runFlowStep(4), FLOW_DURATION['3-pause']);
      }, FLOW_DURATION[3]);
    } else if (FLOW_DURATION[step]) {
      flowTimer = setTimeout(() => runFlowStep(step + 1), FLOW_DURATION[step]);
    }
  }

  /* ──────────────────────────────────────────
     오디오 (COMPLETE 전용)
  ────────────────────────────────────────── */
  const audio = document.getElementById('audio-player');
  let isPlaying = false;

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('complete-music-bar').style.width = pct + '%';
  });

  audio.addEventListener('ended', () => {
    isPlaying = false;
    document.getElementById('complete-music-btn').classList.remove('playing');
    document.getElementById('complete-music-label').textContent = '음악 듣기';
    stopParticles();
  });

  function toggleCompleteMusic() {
    const btn = document.getElementById('complete-music-btn');
    const label = document.getElementById('complete-music-label');
    const progress = document.getElementById('complete-music-progress');
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      btn.classList.remove('playing');
      label.textContent = '음악 듣기';
      stopParticles();
    } else {
      audio.play().then(() => {
        isPlaying = true;
        btn.classList.add('playing');
        label.textContent = '재생 중';
        progress.classList.add('show');
        startParticles(selected);
      }).catch(() => {});
    }
  }

  function seekCompleteMusic(e) {
    if (!audio.duration) return;
    const wrap = document.getElementById('complete-music-progress');
    const rect = wrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  }

  function stopCompleteMusic() {
    audio.pause();
    audio.currentTime = 0;
    isPlaying = false;
    const btn = document.getElementById('complete-music-btn');
    if (btn) btn.classList.remove('playing');
    const bar = document.getElementById('complete-music-bar');
    if (bar) bar.style.width = '0%';
    const progress = document.getElementById('complete-music-progress');
    if (progress) progress.classList.remove('show');
    stopParticles();
  }

  function exitFlow() {
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    tapAllowed = false;
    currentStep = 0;
    // 배경색은 선택된 감정 색으로 복원 (선택 상태 유지)
    // selected가 있으면 해당 감정 배경 유지, 없으면 초기화
    if (!selected) {
      document.body.classList.remove(...EMOTION_CLASSES);
      document.body.style.background = '';
    }
    showScreen('emotion');
  }

  function goComplete() {
    clearTimeout(flowTimer);
    showScreen('complete');

    // COMPLETE 애니메이션 트리거 (재진입 대응)
    const completeScreen = document.getElementById('s-complete');
    completeScreen.classList.remove('visible');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => completeScreen.classList.add('visible'));
    });

    // 글귀 세팅 (quotes.js)
    const quote = (typeof getTodayQuote === 'function')
      ? getTodayQuote(selected)
      : '';
    const quoteEl = document.getElementById('complete-quote');
    quoteEl.innerHTML = quote.replace(/\n/g, '<br>');

    // 음악 버튼 세팅
    const musicUrl = (CONTENT[selected].musicUrl || '').trim();
    const musicBtn = document.getElementById('complete-music-btn');
    if (musicUrl) {
      audio.src = musicUrl;
      document.getElementById('complete-music-bar').style.width = '0%';
      document.getElementById('complete-music-label').textContent = '음악 듣기';
      musicBtn.style.display = 'flex';
    } else {
      musicBtn.style.display = 'none';
    }

    // extras 페이드인 (1.8초 딜레이 — 종료 메시지 읽고 나서)
    const extras = document.getElementById('complete-extras');
    const restartBtn = document.getElementById('complete-restart');
    restartBtn.classList.remove('visible');
    extras.style.display = 'flex';
    setTimeout(() => {
      extras.classList.add('visible');
      // extras 페이드인 완료(1.2s) 후 1초 뒤 다시시작 등장
      setTimeout(() => restartBtn.classList.add('visible'), 1000);
    }, 1800);
  }

  function restart() {
    const lastEmoji = selected ? CONTENT[selected].emoji : null;
    stopCompleteMusic();
    clearTimeout(flowTimer);
    // COMPLETE 애니메이션 초기화
    document.getElementById('s-complete').classList.remove('visible');
    document.getElementById('complete-restart').classList.remove('visible');
    // extras 초기화
    const extras = document.getElementById('complete-extras');
    extras.classList.remove('visible');
    extras.style.display = 'none';
    selected = null;
    document.querySelectorAll('.e-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('confirm-btn').disabled = true;
    document.body.classList.remove(...EMOTION_CLASSES);
    document.body.style.background = '';
    showScreen('emotion');
    window.scrollTo(0,0);

    // 잔상 이모지 — 0.5초 후 등장, 2초 유지, 페이드아웃
    if (lastEmoji) {
      const echoEl = document.getElementById('echo-emoji');
      echoEl.textContent = lastEmoji;
      echoEl.classList.remove('visible');
      setTimeout(() => {
        echoEl.classList.add('visible');
        setTimeout(() => {
          echoEl.style.transition = 'opacity 1.5s ease';
          echoEl.classList.remove('visible');
          setTimeout(() => {
            echoEl.style.transition = 'opacity .8s ease';
            echoEl.textContent = '';
          }, 1500);
        }, 2000);
      }, 500);
    }
  }

  /* ──────────────────────────────────────────
     화면 전환
  ────────────────────────────────────────── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s-' + id).classList.add('active');
    window.scrollTo(0, 0);
  }

  /* ──────────────────────────────────────────
     파티클 엔진 (기존 유지)
  ────────────────────────────────────────── */
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animFrame = null;
  let currentEmotion = '';

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const PARTICLE_CONFIG = {
    피곤함: { count:15, color:'rgba(180,190,220,', speedX:.05, speedY:.08, size:1.2, opacity:.25, drift:.01 },
    불안함: { count:30, color:'rgba(180,160,220,', speedX:.3, speedY:.15, size:1.0, opacity:.35, drift:.08, shake:true },
    공허함: { count:3,  color:'rgba(200,200,200,', speedX:.02, speedY:.03, size:1.5, opacity:.2,  drift:.005 },
    쓸쓸함: { count:20, color:'rgba(196,168,130,', speedX:.05, speedY:.25, size:1.0, opacity:.3,  drift:.02, fall:true },
    복잡함: { count:35, color:'rgba(150,180,200,', speedX:.2, speedY:.12, size:1.0, opacity:.3,  drift:.05, multiDir:true },
    괜찮음: { count:25, color:'rgba(196,168,130,', speedX:.08, speedY:.06, size:1.8, opacity:.4,  drift:.02, glow:true }
  };

  function createParticle(cfg) {
    const dir = cfg.multiDir ? (Math.random() - 0.5) * 2 : 1;
    return {
      x: Math.random() * canvas.width,
      y: cfg.fall ? Math.random() * canvas.height * 0.3 : Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * cfg.speedX * dir,
      vy: cfg.fall ? Math.random() * cfg.speedY + 0.1 : (Math.random() - 0.5) * cfg.speedY,
      size: Math.random() * cfg.size + 0.5,
      opacity: Math.random() * cfg.opacity + 0.05,
      drift: cfg.drift,
      shake: cfg.shake || false,
      glow: cfg.glow || false,
      fall: cfg.fall || false,
      color: cfg.color,
      phase: Math.random() * Math.PI * 2
    };
  }

  function startParticles(emotion) {
    cancelAnimationFrame(animFrame);
    currentEmotion = emotion;
    const cfg = PARTICLE_CONFIG[emotion];
    if (!cfg) return;
    particles = [];
    for (let i = 0; i < cfg.count; i++) particles.push(createParticle(cfg));
    canvas.classList.add('active');
    animate();
  }

  function stopParticles() {
    canvas.classList.remove('active');
    cancelAnimationFrame(animFrame);
    setTimeout(() => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
    }, 1500);
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cfg = PARTICLE_CONFIG[currentEmotion];
    if (!cfg) return;
    particles.forEach(p => {
      p.phase += 0.02;
      if (p.shake) p.x += Math.sin(p.phase * 3) * 0.4;
      p.x += p.vx + Math.sin(p.phase) * p.drift;
      p.y += p.vy + Math.cos(p.phase * 0.7) * p.drift;
      if (p.fall) {
        if (p.y > canvas.height) { p.y = -5; p.x = Math.random() * canvas.width; }
      } else {
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.y > canvas.height + 10) p.y = -10;
      }
      ctx.beginPath();
      if (p.glow) { ctx.shadowBlur = 8; ctx.shadowColor = p.color + '0.5)'; }
      else ctx.shadowBlur = 0;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color + p.opacity + ')';
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    animFrame = requestAnimationFrame(animate);
  }

  // 터치 반응 — COMPLETE 화면에서 음악 재생 중일 때만 동작
  document.addEventListener('touchstart', (e) => {
    const completeActive = document.getElementById('s-complete').classList.contains('active');
    if (!completeActive || !isPlaying) return;
    const touch = e.touches[0];
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: touch.clientX + (Math.random() - 0.5) * 30,
        y: touch.clientY + (Math.random() - 0.5) * 30,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8 - 0.3,
        size: Math.random() * 2.5 + 1,
        opacity: 0.55, drift: 0.03,
        shake: false, glow: true, fall: false,
        color: 'rgba(196,168,130,',
        phase: Math.random() * Math.PI * 2
      });
    }
  });

  // FLOW 전체 화면 탭 — 선택적 스킵
  document.getElementById('s-flow').addEventListener('click', (e) => {
    // 종료 버튼, × 버튼 클릭은 각자 처리
    if (e.target.closest('.flow-end-btn') || e.target.closest('.flow-exit-btn')) return;
    if (!tapAllowed || currentStep === 4) return;
    clearTimeout(flowTimer);
    clearTimeout(tapIgnoreTimer);
    tapAllowed = false;
    runFlowStep(currentStep + 1);
  });

  /* ──────────────────────────────────────────
     Init
  ────────────────────────────────────────── */
  renderGrid();

  // 페이지 숨김 시 오디오 일시정지 (모바일 백그라운드 전환 대응)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isPlaying) {
      audio.pause();
      isPlaying = false;
      document.getElementById('complete-music-btn').classList.remove('playing');
      document.getElementById('complete-music-label').textContent = '음악 듣기';
      stopParticles();
    }
  });
</script>
</body>
</html>
