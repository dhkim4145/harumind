<canvas id="aurora" aria-hidden="true"></canvas>
<div id="ambient" aria-hidden="true"></div>

<div class="echo-emoji" id="echo-emoji"></div>

<div class="app">
  <h1 class="sr-only">하루마음 — 하루 끝의 감정을 조용히 마감하는 웹앱</h1>

  <!-- SCREEN 1: 감정 선택 -->
  <div class="screen active" id="s-emotion" role="region" aria-label="감정 선택" tabindex="-1">
    <div class="header">
      <div class="wordmark">하루마음</div>
      <div class="h-title">오늘 하루,<br>어떤 감정이 가장 가까웠나요</div>
      <div class="h-subtitle">오늘을 조용히 닫습니다</div>
    </div>
    <div class="emotion-grid" id="emotion-grid"></div>
    <button class="btn btn-primary" id="confirm-btn" onclick="startTransition()" disabled>
      이 감정으로 오늘을 마감합니다
    </button>
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" onclick="toggleSound()">
      작은 소리 켜기
    </button>
    <div class="privacy-notice">
      <p>하루마음은 감정 기록을 저장하지 않습니다.<br>사운드 설정은 기기에 저장될 수 있으며,<br>서비스 안정성과 사용성 개선을 위해 Google Analytics 이용 통계를 확인합니다.</p>
      <a href="about.html">하루마음 소개</a> · <a href="privacy.html">개인정보처리방침</a>
    </div>
  </div>

  <!-- SCREEN 2: TRANSITION -->
  <div class="screen" id="s-transition" role="region" aria-label="하루를 닫는 전환" tabindex="-1">
    <button class="flow-exit-btn" onclick="exitFlow()" aria-label="감정 선택으로 돌아가기">×</button>
    <button class="sound-icon-toggle" type="button" aria-label="작은 소리 켜기" aria-pressed="false" onclick="toggleSound()"><span class="sound-icon-label">소리</span></button>
    <div class="transition-text" id="transition-line1"></div>
    <div class="transition-text transition-line2" id="transition-line2"></div>
    <div class="sr-only" id="transition-announcer" aria-live="polite" aria-atomic="true"></div>
    <div class="transition-breath" id="transition-breath" aria-hidden="true">
      <span class="transition-breath-line"></span>
    </div>
  </div>

  <!-- SCREEN 3: FLOW -->
  <div class="screen" id="s-flow" role="region" aria-label="오늘에 머무르기" tabindex="-1">
    <button class="flow-exit-btn" onclick="exitFlow()" aria-label="감정 선택으로 돌아가기">×</button>
    <button class="sound-icon-toggle" type="button" aria-label="작은 소리 켜기" aria-pressed="false" onclick="toggleSound()"><span class="sound-icon-label">소리</span></button>
    <div class="flow-trace" id="flow-trace" aria-hidden="true">
      <span class="flow-trace-fill"></span>
    </div>
    <div class="flow-text" id="flow-text" aria-live="polite"></div>
    <div class="step-reward" id="step-reward" aria-live="polite"></div>

  </div>

<div class="hold-btn-wrap" id="hold-wrap">
  <button class="hold-btn" id="hold-btn" aria-label="길게 눌러 머무르기" aria-keyshortcuts="Enter Space" aria-disabled="true">
    <span class="hold-orb" aria-hidden="true"></span>
    <span class="hold-btn-label">손을 가볍게 올려두세요</span>
  </button>
</div>

  <!-- SCREEN 4: COMPLETE -->
  <div class="screen" id="s-complete" role="region" aria-label="오늘 마감 완료" tabindex="-1">
    <span class="complete-moon" id="complete-moon" aria-hidden="true"></span>
    <div class="complete-emotion" id="complete-emotion"></div>
    <div class="complete-sub">충분합니다</div>
    <div class="complete-extras" id="complete-extras">
      <div class="complete-quote-wrap">
        <div class="complete-quote" id="complete-quote"></div>
      </div>
    </div>
    <button class="complete-restart" id="complete-restart" aria-label="처음 화면으로 돌아가기" onclick="restart()">처음으로</button>
  </div>
