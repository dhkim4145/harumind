  /* 감정별 Hold 버튼 색상 */

  /* hold-btn 색상·글로우·페이드 — 감정별 CSS 변수 적용 */
  .hold-btn {

  /* Hold to Calm 버튼 */

  .hold-btn::before {

  .hold-btn-label { position: relative; z-index: 1; }

  
  /* 파문(ripple) 효과 */
  .ripple-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;

  .ripple-circle {

  @keyframes ripple-expand {

  .screen-wash {

  canvas#complete-fx.visible { opacity: 1; }


  /* 감정별 transition 진입 애니메이션 */

  /* 피곤함 — 위에서 내려앉음 */
  .transition-enter-피곤함 {
    opacity: 0 !important;
    transform: translateY(-20px) !important;
    filter: blur(2px) !important;
    transition: opacity 1.4s cubic-bezier(.22,1,.36,1),
                transform 1.4s cubic-bezier(.22,1,.36,1),
                filter 1.4s cubic-bezier(.22,1,.36,1) !important;
  }

    opacity: 1 !important;
    transform: translateY(0) !important;

  /* 불안함 — 미세하게 흔들리다 멈춤 */
  .transition-enter-불안함 {
    opacity: 0 !important;

    filter: blur(2px) !important;
    transition: opacity 1s cubic-bezier(.22,1,.36,1),
                filter 1s cubic-bezier(.22,1,.36,1) !important;
  }
  .transition-enter-불안함.visible {
    opacity: 1 !important;
    filter: blur(0) !important;
    animation: tremble-settle 0.8s ease-out forwards;
  }
  @keyframes tremble-settle {
    0%   { transform: translateX(-4px); }
    20%  { transform: translateX(3px); }
    40%  { transform: translateX(-2px); }
    60%  { transform: translateX(1px); }
    80%  { transform: translateX(-1px); }
    100% { transform: translateX(0); }
  }

  /* 공허함 — 아주 천천히 페이드인 */
  .transition-enter-공허함 {
    opacity: 0 !important;
    transform: none !important;
    filter: blur(4px) !important;
    transition: opacity 2.4s cubic-bezier(.4,0,.2,1),
                filter 2.4s cubic-bezier(.4,0,.2,1) !important;
  }
  .transition-enter-공허함.visible {
    opacity: 0.85 !important;
    filter: blur(0) !important;
  }

  /* 쓸쓸함 — 오른쪽에서 천천히 흘러들어옴 */
  .transition-enter-쓸쓸함 {

  /* 복잡함 — 각각 다른 방향에서 */

  }

  /* 괜찮음 — 중앙에서 자연스럽게 퍼짐 */
  .transition-enter-괜찮음 {
    opacity: 0 !important;
    transform: scale(0.94) !important;
    filter: blur(1px) !important;
    transition: opacity 1.2s cubic-bezier(.22,1,.36,1),

                filter 1.2s cubic-bezier(.22,1,.36,1) !important;
  }

  }


  /* 누르는 동안 화면 반응 오버레이 */

  #screen-react {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4;
    opacity: 1;
    transition: filter 0.3s ease;
  }
  /* 누적 정착 레이어 — 완료될 때마다 쌓임 */
  #screen-settled {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;

    opacity: calc(var(--flow-progress) * 0.16);

  /* transition 힌트 텍스트 */
  .transition-hint {

    color: var(--text-muted); letter-spacing: .12em;

      animation-duration: 0.01ms !important;

  }

<script>
  let selected = null;

  const EMOTION_DESC = {
    피곤함: '몸도 마음도 지쳤을 때',
    불안함: '마음이 가라앉지 않을 때',
    공허함: '아무것도 느껴지지 않을 때',
    쓸쓸함: '혼자인 느낌이 들 때',
    복잡함: '생각이 정리되지 않을 때',
    괜찮음: '무난했지만 닫고 싶은 날'
  };

  function renderGrid() {
    const grid = document.getElementById('emotion-grid');
    Object.entries(CONTENT).forEach(([name, data]) => {
      const card = document.createElement('div');
      card.className = 'e-card';
      card.dataset.key = name;
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-pressed', 'false');
      card.innerHTML = `
        <div class="e-dot" style="background:${data.color};"></div>
        <div class="e-word">${name}</div>
        <div class="e-desc">${EMOTION_DESC[name] || ''}</div>
      `;
      card.addEventListener('click', () => selectEmotion(name, card));
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectEmotion(name, card);
        }
      });
      grid.appendChild(card);
    });
  }

  const EMOTION_CLASSES = ['emotion-피곤함','emotion-불안함','emotion-공허함','emotion-쓸쓸함','emotion-복잡함','emotion-괜찮음'];

  function selectEmotion(name, card) {
    document.querySelectorAll('.e-card').forEach(c => {
      c.classList.remove('selected');
      c.setAttribute('aria-pressed', 'false');
    });
    card.classList.add('selected');
    card.setAttribute('aria-pressed', 'true');
    selected = name;
    document.getElementById('confirm-btn').disabled = false;
    document.body.classList.remove(...EMOTION_CLASSES);
    document.body.classList.add('emotion-' + name);
    startAurora(name);
    const confirmBtn = document.getElementById('confirm-btn');
    if (confirmBtn) confirmBtn.textContent = CONFIRM_LABELS[name] || '오늘은 여기까지입니다';
  }

  const SOUND_STORAGE_KEY = 'harumind_sound_enabled';
  const EMOTION_TONE = {
    피곤함: 174,
    불안함: 196,
    공허함: 130,
    쓸쓸함: 164,
    복잡함: 220,
    괜찮음: 246
  };
  let audioCtx = null;
  let masterGain = null;
  let soundEnabled = false;

  function initAudio() {
    if (!soundEnabled) return;
    try {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioCtx) {
        audioCtx = new AudioCtor();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.24, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    } catch (err) {
      audioCtx = null;
      masterGain = null;
    }
  }

  function updateSoundToggle() {
    const btn = document.getElementById('sound-toggle');
    if (btn) {
      btn.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
      btn.textContent = soundEnabled ? '작은 소리 켜짐' : '작은 소리 켜기';
    }
    document.querySelectorAll('.sound-icon-toggle').forEach(icon => {
      icon.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
      icon.setAttribute('aria-label', soundEnabled ? '작은 소리 끄기' : '작은 소리 켜기');
    });
  }

  function setSoundEnabled(enabled, options = {}) {
    soundEnabled = !!enabled;
    try {
      localStorage.setItem(SOUND_STORAGE_KEY, soundEnabled ? 'true' : 'false');
    } catch (err) {}
    updateSoundToggle();
    if (soundEnabled) initAudio();
    if (soundEnabled && options.playTest) playSoundTestBloom();
  }

  function toggleSound() {
    const nextEnabled = !soundEnabled;
    setSoundEnabled(nextEnabled, { playTest: nextEnabled });
  }

  function loadSoundPreference() {
    try {
      soundEnabled = localStorage.getItem(SOUND_STORAGE_KEY) === 'true';
    } catch (err) {
      soundEnabled = false;
    }
    updateSoundToggle();
  }

  function getAudioNow() {
    if (!soundEnabled) return null;
    initAudio();
    if (!audioCtx || !masterGain) return null;
    return audioCtx.currentTime;
  }

  function playSoftTone(freq, duration, type = 'sine', volume = 0.025, when = 0, filterFreq = 700, attack = 0.045) {
    const baseNow = getAudioNow();
    if (baseNow === null) return;
    try {
      const now = baseNow + when;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.92), now + duration);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.setValueAtTime(0.2, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(volume, now + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + duration + 0.06);
    } catch (err) {}
  }

  function playAirNoise(duration = 0.45, volume = 0.012, filterFreq = 360, when = 0) {
    const baseNow = getAudioNow();
    if (baseNow === null) return;
    try {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, Math.max(1, Math.floor(sampleRate * duration)), sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / data.length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2);
      }
      const now = baseNow + when;
      const src = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      src.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.setValueAtTime(0.35, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      src.start(now);
      src.stop(now + duration + 0.03);
    } catch (err) {}
  }

  function playSoundTestBloom() {
    playSoftTone(174, 0.44, 'sine', 0.03, 0, 520);
    playSoftTone(620, 0.42, 'sine', 0.024, 0.014, 1150);
    playSoftTone(780, 0.34, 'sine', 0.013, 0.04, 1150);
    playSoftTone(980, 0.26, 'sine', 0.004, 0.08, 1200);
    playSoftTone(246, 0.48, 'sine', 0.016, 0.045, 760);
    playSoftTone(98, 0.48, 'sine', 0.012, 0.015, 360);
    playAirNoise(0.38, 0.008, 520, 0.015);
  }

  function playEmotionEnterSound(emotion) {
    const base = EMOTION_TONE[emotion] || 174;
    playSoftTone(base, 0.78, 'sine', 0.032, 0, 620);

  let flowTimer = null;
  let currentStep = 0;
  let completedSteps = 0;

  function resetFlowCompletion() {
    completedSteps = 0;
    document.documentElement.style.setProperty('--flow-progress', 0);
    document.documentElement.style.setProperty('--hold-progress', 0);
    delete document.body.dataset.flowProgress;
    const rewardEl = document.getElementById('step-reward');
    if (rewardEl) {
      rewardEl.classList.remove('visible');
      rewardEl.textContent = '';
    }

  function colorWithAlpha(color, alpha) {
    const m = String(color).match(/rgba?\(([^)]+)\)/);
    if (!m) return color;
    const parts = m[1].split(',').map(v => v.trim());
    return `rgba(${parts[0]},${parts[1]},${parts[2]},${alpha})`;
  }

  function playTransitionEntry(color) {
    const wash = document.getElementById('screen-wash');
    if (!wash) return;
    wash.classList.remove('transition-enter', 'flash', 'fade');
    wash.style.background = `radial-gradient(circle at 50% 48%, ${colorWithAlpha(color, 0.18)} 0%, ${colorWithAlpha(color, 0.08)} 34%, rgba(0,0,0,0) 72%)`;
    wash.style.transform = 'scale(0.72)';
    wash.style.transition = 'opacity 0.85s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1)';
    wash.style.opacity = '0';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        wash.classList.add('transition-enter');
        wash.style.opacity = '1';
        wash.style.transform = 'scale(1)';
        setTimeout(() => {
          wash.style.opacity = '0';
          wash.style.transform = 'scale(1.08)';
        }, 900);
        setTimeout(() => {
          wash.classList.remove('transition-enter');
          wash.style.background = '';
          wash.style.transform = '';
          wash.style.transition = '';
          wash.style.opacity = '';
        }, 1600);
      });
    });
  }

  function startTransition() {
    if (!selected) return;
    resetFlowCompletion();
    showScreen('transition');
    const data = CONTENT[selected];
    playTransitionEntry(data.color);
    playEmotionEnterSound(selected);
    const line1 = document.getElementById('transition-line1');
    const line2 = document.getElementById('transition-line2');
    line1.textContent = data.transition[0];
    line2.textContent = data.transition[1];

    // 감정별 클래스 초기화
    line1.className = 'transition-text';
    line2.className = 'transition-text transition-line2';

    // 감정별 진입 클래스 적용
    if (selected === '복잡함') {
      line1.classList.add('transition-enter-복잡함-1');
      line2.classList.add('transition-enter-복잡함-2');
    } else {
      const cls = 'transition-enter-' + selected;
      line1.classList.add(cls);
      line2.classList.add(cls);
    }

    // Aurora 진입 시 밝아짐 (공통)
    if (auroraCanvas && auroraCtx) {
      let a = 0, dec = false;
      const burst = () => {
        if (!dec) { a += 0.012; if (a >= 0.12) dec = true; }
        else { a -= 0.005; if (a <= 0) return; }
        auroraCtx.fillStyle = 'rgba(255,255,255,' + a + ')';
        auroraCtx.fillRect(0, 0, auroraCanvas.width, auroraCanvas.height);
        requestAnimationFrame(burst);
      };
      requestAnimationFrame(burst);
    }

    const line2Delay = selected === '공허함' ? 2000 : selected === '피곤함' ? 1600 : 1200;
    const flowDelay  = selected === '공허함' ? 4000 : 3200;
    const totalDelay = 400 + line2Delay + flowDelay;

    // 힌트 텍스트
    const hint = document.getElementById('transition-hint');
    if (hint) { hint.classList.remove('visible'); }

    // 진행 바 초기화
    const prog = document.getElementById('transition-progress');
    const progBar = document.getElementById('transition-progress-bar');
    if (prog && progBar) {
      prog.classList.remove('visible');
      progBar.style.transition = 'none';
      progBar.style.width = '0%';
    }

    flowTimer = setTimeout(() => {
      line1.classList.add('visible');

      // 진행 바 시작
      if (prog && progBar) {
        prog.classList.add('visible');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            progBar.style.transition = `width ${line2Delay + flowDelay}ms linear`;
            progBar.style.width = '100%';
          });
        });
      }

      flowTimer = setTimeout(() => {
        line2.classList.add('visible');

        // 힌트 텍스트 등장
        if (hint) hint.classList.add('visible');

        flowTimer = setTimeout(() => {
          // 진행 바 숨김
          if (prog) prog.classList.remove('visible');
          if (hint) hint.classList.remove('visible');
          startFlow();
        }, flowDelay);
      }, line2Delay);
    }, 400);
  }

  function startFlow() {
    showScreen('flow');
    runFlowStep(1);
    showHoldBtn();
  }

  function runFlowStep(step) {
    clearTimeout(flowTimer);
    currentStep = step;
    document.documentElement.style.setProperty('--hold-progress', 0);

    document.querySelectorAll('.flow-dot').forEach(d => {
      const s = parseInt(d.dataset.step);
      d.classList.remove('active', 'done');
      if (s === step) d.classList.add('active');
      else if (s < step) d.classList.add('done');
    });

    document.getElementById('flow-step-indicator').textContent = `${step} / 4`;

    const textEl = document.getElementById('flow-text');
    textEl.classList.remove('visible', 'rewarded');
    const rewardEl = document.getElementById('step-reward');
    if (rewardEl) rewardEl.classList.remove('visible');
    const blankDelay = (step === 1) ? 0 : 300;

    setTimeout(() => {
      textEl.classList.remove('step-3', 'step-4');
      textEl.textContent = '';
      let text = step === 1 ? (FLOW_STEP1[selected] || '') : (FLOW_COMMON[step] || '');
      if (step === 3) textEl.classList.add('step-3');
      if (step === 4) textEl.classList.add('step-4');
      textEl.textContent = text;
      const fadeDelay = (step === 3) ? 200 : (step === 4) ? 500 : 80;
      setTimeout(() => textEl.classList.add('visible'), fadeDelay);
    }, blankDelay);



    // 모든 단계 Hold to Calm으로만 넘어감 — 자동 타이머 없음
    setTimeout(() => updateHoldLabel(), 100);
  }

  function applyStepCompletion(step) {
    completedSteps = Math.max(completedSteps, step);
    document.documentElement.style.setProperty('--flow-progress', completedSteps / 4);
    document.body.dataset.flowProgress = String(completedSteps);

    document.querySelectorAll('.flow-dot').forEach(d => {
      const s = parseInt(d.dataset.step);
      if (s <= completedSteps) d.classList.add('done');
    });
  }

  const STEP_REWARD_TEXT = {

    document.getElementById('transition-line1').classList.remove('visible');

  function restart() {

    clearTimeout(flowTimer);

    document.getElementById('s-complete').classList.remove('visible');

  function showScreen(id) {

  // 화면 탭으로 넘기는 기능 제거 — Hold to Calm으로 대체
  // s-flow 클릭은 exit/end 버튼만 처리



  // ===== 누르는 동안 화면 반응 — 게이지 연동 =====

  function getCurrentFlowText() {
    if (currentStep === 1) return FLOW_STEP1[selected] || '';
    return FLOW_COMMON[currentStep] || '';
  }

  // 누적 상태 관리
  let settledDark = 0;    // 어두움 누적값 (0~1)
  let settledBright = 0;  // 밝음 누적값 (0~1)
  let settledGray = 0;    // 채도 누적값 (0~1)

  function applySettled() {
    const el = document.getElementById('screen-settled');
    if (!el) return;
    if (settledBright > 0) {
      el.style.background = `rgba(255,255,255,${settledBright})`;
      el.style.filter = '';
    } else if (settledGray > 0) {
      el.style.background = 'transparent';
      el.style.filter = `grayscale(${settledGray}) brightness(${1 - settledGray * 0.3})`;
    } else {
      el.style.background = `rgba(0,0,0,${settledDark})`;
      el.style.filter = '';
    }
  }

  function addSettled(type) {
    // 타입 전환 시 이전 값 리셋 — 어색한 혼합 방지
    const isDark  = type === 'dark' || type === 'top' || type === 'edge';
    const isBright = type === 'bright';
    const isGray   = type === 'gray';

    if (isDark) {
      if (settledBright > 0 || settledGray > 0) { settledBright = 0; settledGray = 0; }
      settledDark = Math.min(settledDark + (type === 'edge' ? 0.08 : 0.12), 0.45);
    } else if (isBright) {
      if (settledDark > 0 || settledGray > 0) { settledDark = 0; settledGray = 0; }
      settledBright = Math.min(settledBright + 0.05, 0.18);
    } else if (isGray) {
      if (settledDark > 0 || settledBright > 0) { settledDark = 0; settledBright = 0; }
      settledGray = Math.min(settledGray + 0.2, 0.7);
    }
    applySettled();
  }

  function resetSettled() {
    settledDark = 0; settledBright = 0; settledGray = 0;
    const el = document.getElementById('screen-settled');
    if (el) {
      el.style.transition = 'background 0.6s ease, filter 0.6s ease';
      el.style.background = '';
      el.style.filter = '';
      setTimeout(() => { if (el) el.style.transition = ''; }, 700);
    }
  }

  // 문구별 화면 진행 설정
  // type: 'dark'=어두워짐 'bright'=밝아짐 'gray'=채도빠짐
  //       'edge'=가장자리번짐 'top'=위에서내려옴 'silent'=없음
  const TEXT_REACT_TYPE = {
    '힘을 풉니다':           'dark',
    '숨을 내쉽니다':         'bright',
    '비워둡니다':            'gray',
    '여기 있습니다':         'edge',
    '내려놓습니다':          'top',
    '그대로입니다':          'silent',
    '그대로 둡니다':         'dark',
    '정리하지 않아도 됩니다': 'silent',
    '괜찮습니다':            'bright',
    '오늘은 여기까지입니다':  'dark'
  };

  function updateScreenReact(pct) {
    const el = document.getElementById('screen-react');
    if (!el) return;
    const text = getCurrentFlowText();
    const type = TEXT_REACT_TYPE[text] || 'silent';
    const t = pct / 100;

    if (type === 'silent') {
      el.style.opacity = '0';
      return;
    }

    el.style.opacity = '1';

    if (type === 'dark') {
      const a = t * 0.52;
      el.style.background = `rgba(0,0,0,${a})`;
      el.style.filter = '';
    } else if (type === 'bright') {
      const a = t * 0.18;
      el.style.background = `rgba(255,255,255,${a})`;
      el.style.filter = '';
    } else if (type === 'gray') {
      const g = t * 0.85;
      el.style.background = 'transparent';
      el.style.filter = `grayscale(${g}) brightness(${1 - t * 0.28})`;
    } else if (type === 'edge') {
      const a = t * 0.42;
      el.style.background = `radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 30%, rgba(196,150,110,${a}) 100%)`;
      el.style.filter = '';
    } else if (type === 'top') {
      const a = t * 0.45;
      el.style.background = `linear-gradient(180deg, rgba(0,0,0,${a}) 0%, rgba(0,0,0,0) 70%)`;
      el.style.filter = '';
    }
  }



  function stopScreenReact() {
    const el = document.getElementById('screen-react');
    if (!el) return;
    el.style.transition = 'background 0.35s ease, filter 0.35s ease';
    el.style.background = '';
    el.style.filter = '';
    setTimeout(() => { el.style.transition = ''; }, 400);
  }


  function completeScreenImpact() {
    const el = document.getElementById('screen-react');
    if (!el) return;
    const text = getCurrentFlowText();
    const type = TEXT_REACT_TYPE[text] || 'silent';
    if (type === 'silent') return;

    if (type === 'dark' || type === 'top') {
      el.style.background = type === 'top'
        ? 'linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 70%)'
        : 'rgba(0,0,0,0.65)';
    } else if (type === 'bright') {
      el.style.background = 'rgba(255,255,255,0.26)';
    } else if (type === 'gray') {
      el.style.filter = 'grayscale(1) brightness(0.65)';
    } else if (type === 'edge') {
      el.style.background = 'radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 20%, rgba(196,150,110,0.58) 100%)';
    }

    addSettled(type);
  }

  // ===== AURORA 배경 =====
  const CONFIRM_LABELS = {
    피곤함: '오늘 하루, 여기서 내려놓겠습니다',
    불안함: '오늘은 여기서 멈추겠습니다',
    공허함: '오늘은 그냥 이대로 두겠습니다',
    쓸쓸함: '오늘 하루, 그대로 마감합니다',
    복잡함: '정리하지 않아도 됩니다. 마감합니다',
    괜찮음: '오늘은 여기까지입니다 🌙'
  };

  const AURORA_COLORS = {
    피곤함: [[26,31,46],[18,24,40]],
    불안함: [[26,21,40],[20,16,36]],
    공허함: [[18,18,18],[10,10,10]],
    쓸쓸함: [[32,22,18],[20,14,12]],
    복잡함: [[15,30,34],[10,18,22]],
    괜찮음: [[22,26,44],[16,20,36]]
  };

  let auroraCanvas, auroraCtx, auroraAnim, auroraEmotion = null;
  let auroraT = 0;

  function initAurora() {
    auroraCanvas = document.getElementById('aurora');
    if (!auroraCanvas) return;
    auroraCtx = auroraCanvas.getContext('2d');
    resizeAurora();
    window.addEventListener('resize', resizeAurora);
  }

  function resizeAurora() {
    if (!auroraCanvas) return;
    auroraCanvas.width = window.innerWidth;
    auroraCanvas.height = window.innerHeight;
  }

  function startAurora(emotion) {
    if (!auroraCanvas) return;
    auroraEmotion = emotion;
    auroraCanvas.style.transition = 'opacity 1.2s ease';
    auroraCanvas.style.opacity = '';
    auroraCanvas.classList.add('visible');
    if (auroraAnim) cancelAnimationFrame(auroraAnim);
    drawAurora();
  }

  function stopAurora() {
    if (auroraCanvas) auroraCanvas.classList.remove('visible');
    if (auroraAnim) cancelAnimationFrame(auroraAnim);
    auroraEmotion = null;
  }

  function drawAurora() {
    if (!auroraEmotion) return;
    const colors = AURORA_COLORS[auroraEmotion] || AURORA_COLORS['괜찮음'];
    const w = auroraCanvas.width, h = auroraCanvas.height;
    const ctx = auroraCtx;
    auroraT += 0.003;

    ctx.clearRect(0, 0, w, h);

    // 베이스 배경
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, `rgb(${colors[0].join(',')})`);
    bg.addColorStop(1, `rgb(${colors[1].join(',')})`);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // 오로라 레이어 1
    const x1 = w * (0.3 + Math.sin(auroraT * 0.7) * 0.2);
    const y1 = h * (0.2 + Math.cos(auroraT * 0.5) * 0.1);
    const r1 = w * (0.6 + Math.sin(auroraT * 0.3) * 0.1);
    const g1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, r1);
    const c0 = colors[0];
    g1.addColorStop(0, `rgba(${Math.min(c0[0]+20,255)},${Math.min(c0[1]+15,255)},${Math.min(c0[2]+30,255)},0.35)`);
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, w, h);

    // 오로라 레이어 2
    const x2 = w * (0.7 + Math.cos(auroraT * 0.6) * 0.2);
    const y2 = h * (0.4 + Math.sin(auroraT * 0.4) * 0.15);
    const r2 = w * (0.5 + Math.cos(auroraT * 0.4) * 0.1);
    const g2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, r2);
    g2.addColorStop(0, `rgba(${Math.min(c0[0]+10,255)},${Math.min(c0[1]+25,255)},${Math.min(c0[2]+20,255)},0.25)`);
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, w, h);

    auroraAnim = requestAnimationFrame(drawAurora);
  }

  // ===== HOLD TO CALM =====
  const HOLD_MAP = {
    피곤함: { 1: 1100, 2: 1400, 3: 1800, 4: 1300 },
    불안함: { 1: 1300, 2: 1700, 3: 2400, 4: 1300 },
    공허함: { 1: 1600, 2: 2100, 3: 2800, 4: 1300 },
    쓸쓸함: { 1: 1300, 2: 1800, 3: 2400, 4: 1300 },
    복잡함: { 1: 1400, 2: 1700, 3: 2200, 4: 1300 },
    괜찮음: { 1: 900, 2: 1100, 3: 1400, 4: 1000 }
  };
  function getHoldDuration() {
    const map = HOLD_MAP[selected] || HOLD_MAP['피곤함'];
    return map[currentStep] || 1600;
  }
  let holdActive = false, holdRAF = null, holdStartTime = null;

  function initHold() {
    const btn = document.getElementById('hold-btn');
    if (!btn) return;

    function getBar() {
      return btn.querySelector('span.hold-bar') || null;
    }

    function onStart(e) {
      e.preventDefault();
      if (currentStep === 0 || holdActive) return;
      holdActive = true;
      holdStartTime = Date.now();
      document.documentElement.style.setProperty('--hold-progress', 0);
      btn.classList.add('holding');
      animateBar();
    }

    function animateBar() {
      if (!holdActive) return;
      const elapsed = Date.now() - holdStartTime;
      const pct = Math.min(elapsed / getHoldDuration() * 100, 100);
      btn.style.setProperty('--bar-pct', pct + '%');
      document.documentElement.style.setProperty('--hold-progress', pct / 100);
      updateScreenReact(pct);
      if (pct >= 100) {
        onComplete();
        return;
      }
      holdRAF = requestAnimationFrame(animateBar);
    }

    function onComplete() {
      holdActive = false;
      cancelAnimationFrame(holdRAF);
      btn.style.setProperty('--bar-pct', '100%');
      document.documentElement.style.setProperty('--hold-progress', 1);
      clearTimeout(flowTimer);
      const stepAtComplete = currentStep;

      completeScreenImpact();
      applyStepCompletion(stepAtComplete);
      showStepReward(stepAtComplete);
      playStepReward(stepAtComplete);
      if (stepAtComplete === 3) {
        playOkayRewardSound();
        emphasizeOkayReward();
      } else {
        playStepCompleteSound(stepAtComplete);
      }

      const nextDelay = stepAtComplete === 3 ? 900 : 600;

      setTimeout(() => {
        stopScreenReact();
        btn.classList.remove('holding');
        btn.style.setProperty('--bar-pct', '0%');
        document.documentElement.style.setProperty('--hold-progress', 0);
        if (stepAtComplete >= 4) {
          setTimeout(() => goComplete(), 500);
        } else {
          runFlowStep(stepAtComplete + 1);
        }
      }, nextDelay);
    }

    function onEnd(e) {
      e.preventDefault();
      if (!holdActive) return;
      holdActive = false;
      cancelAnimationFrame(holdRAF);
      btn.classList.remove('holding');
      btn.style.setProperty('--bar-pct', '0%');
      document.documentElement.style.setProperty('--hold-progress', 0);
      stopScreenReact();
    }

    btn.addEventListener('mousedown', onStart);
    btn.addEventListener('touchstart', onStart, { passive: false });
    btn.addEventListener('mouseup', onEnd);
    btn.addEventListener('mouseleave', onEnd);
    btn.addEventListener('touchend', onEnd);
    btn.addEventListener('touchcancel', onEnd);
  }

  const HOLD_LABELS = {
    1: '길게 누르고 잠시 머물러요',
    2: '조금 더 머물러요',
    3: '충분히 머물러도 됩니다',
    4: '오늘을 마감합니다'
  };

  function showHoldBtn() {
    const wrap = document.getElementById('hold-wrap');
    if (wrap) wrap.classList.add('visible');
    updateHoldLabel();
  }

  function updateHoldLabel() {
    const label = document.querySelector('.hold-btn-label');
    if (label) label.textContent = HOLD_LABELS[currentStep] || HOLD_LABELS[1];
  }

  function hideHoldBtn() {
    const wrap = document.getElementById('hold-wrap');
    if (wrap) wrap.classList.remove('visible');
    const btn = document.getElementById('hold-btn');
    if (btn) {
      btn.classList.remove('holding');
      btn.style.setProperty('--bar-pct', '0%');
    }
    document.documentElement.style.setProperty('--hold-progress', 0);
    holdActive = false;
    if (holdRAF) cancelAnimationFrame(holdRAF);
  }

  document.addEventListener('DOMContentLoaded', function() {
    loadSoundPreference();
    initAurora();
    initHold();
  });

  // ===== 문구별 연출 시스템 (재설계) =====
  // 문구 → 연출 매핑
  // 힘을 풉니다  → Aurora 어두워짐 (긴장이 내려가는)
  // 숨을 내쉽니다 → 화면 부드러운 수축 (내쉼)
  // 비워둡니다   → 완전한 정지 (비움)
  // 여기 있습니다 → 파문 하나 퍼졌다 사라짐 (존재감)
  // 내려놓습니다  → 빛이 아래로 흘러내림
  // 그대로입니다  → 아무 연출 없음 (침묵이 보상)
  // 그대로 둡니다 → 파문이 퍼졌다 잔잔히 사라짐
  // 정리하지 않아도 됩니다 → 흩어진 채 그냥 있음 (선이 머뭄)
  // 괜찮습니다   → 화면 아주 살짝 밝아졌다 원래로
  // 오늘은 여기까지입니다 → Aurora 천천히 꺼짐

  // 문구별 연출 함수 매핑
  const TEXT_FX_MAP = {
    '힘을 풉니다':           fxRelax,
    '숨을 내쉽니다':         fxBreathe,
    '비워둡니다':            fxEmpty,
    '여기 있습니다':         fxPresence,
    '내려놓습니다':          fxLetGo,
    '그대로입니다':          fxSilence,
    '그대로 둡니다':         fxSettle,
    '정리하지 않아도 됩니다': fxStay,
    '괜찮습니다':            fxOkay,
    '오늘은 여기까지입니다':  fxClose
  };

  function getCurrentText() {
    if (currentStep === 1) return FLOW_STEP1[selected] || '';
    return FLOW_COMMON[currentStep] || '';
  }

  function playStepReward(step) {
    const text = step === 1 ? (FLOW_STEP1[selected] || '') : (FLOW_COMMON[step] || '');
    const fn = TEXT_FX_MAP[text];
    if (fn) fn();
  }

  // ===== 연출 함수들 =====

  // 힘을 풉니다 — Aurora 한 톤 어두워짐
  function fxRelax() {
    if (!auroraCanvas || !auroraCtx) return;
    let alpha = 0;
    const darken = () => {
      alpha += 0.015; if (alpha > 0.25) return;
      auroraCtx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
      auroraCtx.fillRect(0, 0, auroraCanvas.width, auroraCanvas.height);
      requestAnimationFrame(darken);
    };
    darken();
  }

  // 숨을 내쉽니다 — 파문 하나, 숨 내쉬듯 느리게
  function fxBreathe() {
    const overlay = document.getElementById('ripple-overlay');
    if (!overlay) return;
    const c = document.createElement('div');
    c.className = 'ripple-circle';
    c.style.cssText = 'width:60px;height:60px;border:1px solid rgba(140,100,180,0.5);animation-duration:2s;';
    overlay.appendChild(c);
    setTimeout(() => c.remove(), 2100);
  }

  // 비워둡니다 — 완전한 정지, 0.8초 아무것도 없음
  function fxEmpty() {
    // 아무것도 하지 않음 — 정지가 연출
    // Aurora만 계속 흐름
  }

  // 여기 있습니다 — 작은 파문 하나
  function fxPresence() {
    const overlay = document.getElementById('ripple-overlay');
    if (!overlay) return;
    const c = document.createElement('div');
    c.className = 'ripple-circle';
    c.style.cssText = 'width:40px;height:40px;border:1px solid rgba(196,150,110,0.6);animation-duration:1.6s;';
    overlay.appendChild(c);
    setTimeout(() => c.remove(), 1700);
  }

  // 내려놓습니다 — 빛이 아래로 흘러내림
  function fxLetGo() {
    const wash = document.getElementById('screen-wash');
    if (!wash) return;
    wash.style.cssText = 'background:linear-gradient(180deg,rgba(60,160,160,0.08) 0%,rgba(0,0,0,0) 100%);transition:opacity 0.3s ease-in;';
    wash.style.opacity = '1';
    setTimeout(() => { wash.style.transition = 'opacity 1.2s ease-out'; wash.style.opacity = '0'; }, 300);
    setTimeout(() => { wash.style.cssText = ''; }, 1600);
  }

  // 그대로입니다 — 침묵 (아무 연출 없음)
  function fxSilence() {
    // 의도적으로 비움 — 침묵이 보상
  }

  // 그대로 둡니다 — 파문 퍼졌다 잔잔히
  function fxSettle() {
    const overlay = document.getElementById('ripple-overlay');
    if (!overlay) return;
    const c = document.createElement('div');
    c.className = 'ripple-circle';
    c.style.cssText = 'width:50px;height:50px;border:1px solid rgba(196,168,130,0.45);animation-duration:1.8s;';
    overlay.appendChild(c);
    setTimeout(() => c.remove(), 1900);
  }

  // 정리하지 않아도 됩니다 — 선들이 흩어진 채 머뭄
  function fxStay() {
    if (!cFX) initCompleteFX();
    if (!cFX) return;
    cFX.classList.add('visible');
    const w=cFX.width, h=cFX.height, ctx=cFXCtx;
    const ls = Array.from({length:5}, () => ({
      x1:w*0.2+Math.random()*w*0.6, y1:h*0.2+Math.random()*h*0.6,
      x2:w*0.2+Math.random()*w*0.6, y2:h*0.2+Math.random()*h*0.6,
      a: 0.25
    }));
    let t=0;
    const d=()=>{
      ctx.clearRect(0,0,w,h);
      ls.forEach(l=>{
        const fade = t > 60 ? Math.max(0, l.a - (t-60)/80*l.a) : l.a;
        ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2);
        ctx.strokeStyle='rgba(60,160,160,'+fade+')'; ctx.lineWidth=1; ctx.stroke();
      });
      t++;
      if (t<140) cFXAnim=requestAnimationFrame(d);
      else { ctx.clearRect(0,0,w,h); cFX.classList.remove('visible'); }
    };
    d();
  }

  // 괜찮습니다 — 살짝 밝아졌다 원래로
  function fxOkay() {
    if (!auroraCanvas || !auroraCtx) return;
    let alpha = 0, dec = false;
    const glow = () => {
      if (!dec) { alpha += 0.008; if (alpha >= 0.07) dec = true; }
      else { alpha -= 0.004; if (alpha <= 0) return; }
      auroraCtx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      auroraCtx.fillRect(0, 0, auroraCanvas.width, auroraCanvas.height);
      requestAnimationFrame(glow);
    };
    glow();
  }

  // 오늘은 여기까지입니다 — Aurora 천천히 꺼지며 완료로
  function fxClose() {
    if (!auroraCanvas) return;
    auroraCanvas.style.transition = 'opacity 0.6s ease-out';
    auroraCanvas.style.opacity = '0';
    setTimeout(() => {
      if (auroraAnim) cancelAnimationFrame(auroraAnim);
    }, 700);
  }

  // ===== 최종 완료 연출 =====
  let cFX, cFXCtx, cFXAnim;
  function initCompleteFX() {
    cFX = document.getElementById('complete-fx');
    if (!cFX) return;
    cFXCtx = cFX.getContext('2d');
    cFX.width = window.innerWidth; cFX.height = window.innerHeight;
  }

  function playCompleteFX(emotion) {
    if (!cFX) initCompleteFX();
    if (!cFX) return;
    if (cFXAnim) cancelAnimationFrame(cFXAnim);
    cFXCtx.clearRect(0, 0, cFX.width, cFX.height);
    cFX.classList.add('visible');
    const fns = {
      피곤함: fxFall, 불안함: fxWave, 공허함: fxDot,
      쓸쓸함: fxScatter, 복잡함: fxLines, 괜찮음: fxGold
    };
    (fns[emotion] || fxGold)();
    setTimeout(() => { cFX.classList.remove('visible'); cancelAnimationFrame(cFXAnim); }, 3000);
  }

  function fxFall() {
    const w=cFX.width,h=cFX.height,ctx=cFXCtx;
    const ps=Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*h*0.5,vy:0.5+Math.random()*1.5,a:0.6+Math.random()*0.4,r:1.5+Math.random()*2.5}));
    let t=0; const d=()=>{ctx.clearRect(0,0,w,h);ps.forEach(p=>{p.y+=p.vy;p.a-=0.004;if(p.a<=0)return;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(100,120,180,'+p.a+')';ctx.fill();});t++;if(t<180)cFXAnim=requestAnimationFrame(d);}; d();
  }
  function fxWave() {
    const w=cFX.width,h=cFX.height,ctx=cFXCtx,cx=w/2,cy=h/2;let t=0;
    const d=()=>{ctx.clearRect(0,0,w,h);[t*2,t*2-50,t*2-100].filter(r=>r>0).forEach(r=>{const a=Math.max(0,0.4-r/280);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(140,100,180,'+a+')';ctx.lineWidth=1.5;ctx.stroke();});t++;if(t<180)cFXAnim=requestAnimationFrame(d);}; d();
  }
  function fxDot() {
    const w=cFX.width,h=cFX.height,ctx=cFXCtx;let t=0;
    const d=()=>{ctx.clearRect(0,0,w,h);const a=t<60?t/60*0.7:Math.max(0,0.7-(t-60)/120*0.7);ctx.beginPath();ctx.arc(w/2,h/2,3,0,Math.PI*2);ctx.fillStyle='rgba(220,220,230,'+a+')';ctx.fill();t++;if(t<180)cFXAnim=requestAnimationFrame(d);}; d();
  }
  function fxScatter() {
    const w=cFX.width,h=cFX.height,ctx=cFXCtx;
    const ps=Array.from({length:35},()=>{const ang=Math.random()*Math.PI*2,sp=0.8+Math.random()*1.5;return{x:w/2,y:h/2,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,a:0.7+Math.random()*0.3,r:1.5+Math.random()*2};});
    let t=0; const d=()=>{ctx.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a-=0.005;if(p.a<=0)return;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(196,150,110,'+p.a+')';ctx.fill();});t++;if(t<180)cFXAnim=requestAnimationFrame(d);}; d();
  }
  function fxLines() {
    const w=cFX.width,h=cFX.height,ctx=cFXCtx;
    const ls=Array.from({length:8},()=>({x1:w*0.2+Math.random()*w*0.6,y1:h*0.2+Math.random()*h*0.6,x2:w*0.2+Math.random()*w*0.6,y2:h*0.2+Math.random()*h*0.6,a:0.5+Math.random()*0.3}));
    let t=0; const d=()=>{ctx.clearRect(0,0,w,h);ls.forEach(l=>{const a=Math.max(0,l.a-t/200);ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.strokeStyle='rgba(60,160,160,'+a+')';ctx.lineWidth=1;ctx.stroke();l.x2+=(w/2-l.x2)*0.015;l.y2+=(h/2-l.y2)*0.015;});t++;if(t<180)cFXAnim=requestAnimationFrame(d);}; d();
  }
  function fxGold() {
    const w=cFX.width,h=cFX.height,ctx=cFXCtx;let t=0;
    const d=()=>{ctx.clearRect(0,0,w,h);const a=t<60?t/60*0.18:Math.max(0,0.18-(t-60)/120*0.18);const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*0.6);g.addColorStop(0,'rgba(196,168,80,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);t++;if(t<180)cFXAnim=requestAnimationFrame(d);}; d();
  }

    renderGrid();
</script>
